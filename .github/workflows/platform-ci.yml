name: Platform CI

on:
  push:
    branches: [main, codex/linux-windows-support]
    paths-ignore: [web/**]
  pull_request:
    paths-ignore: [web/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            family: linux
            arch: x86_64
            executable: target/x86_64-unknown-linux-gnu/release/ipatool
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            family: linux
            arch: aarch64
            executable: target/aarch64-unknown-linux-gnu/release/ipatool
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            family: windows
            arch: x86_64
            executable: target/x86_64-pc-windows-msvc/release/ipatool.exe
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            family: windows
            arch: arm64
            executable: target/aarch64-pc-windows-msvc/release/ipatool.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target and components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup +stable target add '${{ matrix.target }}'
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run tests
        run: scripts/test-portable.sh '${{ matrix.target }}'
      - name: Check warnings
        run: cargo +stable clippy --locked --target '${{ matrix.target }}' --all-targets -- -D warnings
      - name: Build release executable
        run: cargo +stable build --locked --release --target '${{ matrix.target }}'
      - name: Smoke test the native executable
        run: |
          executable='${{ matrix.executable }}'
          "$executable" --version
          "$executable" --non-interactive --format json search ScriptWidget --platform macos --country US --limit 1
      - name: Package Linux archive
        if: matrix.family == 'linux'
        run: |
          scripts/package-linux.sh '${{ matrix.arch }}' dist
          (cd dist && sha256sum -c ./*.sha256)
      - name: Package Windows archive
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Architecture '${{ matrix.arch }}' -OutputDirectory dist
          $checksum = Get-Content (Get-ChildItem dist/*.sha256 | Select-Object -First 1).FullName
          $archive = Get-ChildItem dist/*.zip | Select-Object -First 1
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum.Split(' ')[0]) { throw 'Archive checksum mismatch' }
