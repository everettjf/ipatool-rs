[package]
name = "ipatool-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of ipatool-fairplay"

[[bin]]
name = "ipatool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
plist = "1.10"
regex = "1.13"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
