[package]
name = "ipatool-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of ipatool-fairplay"

[[bin]]
name = "ipatool"
path = "src/main.rs"

[dependencies]
getrandom = "0.4"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
plist = "1.10"
regex = "1.13"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
unicode-normalization = "0.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate", "unreserved"] }
zeroize = "1.9"
clap_complete = "4.5"
cookie = "0.18"
libc = "0.2"
zstd = "0.13"
libloading = "0.8"
dirs = "6"
tempfile = "3.27"
base64 = "0.22"
hpke = { version = "0.14.1", default-features = false, features = ["nistp", "aes", "alloc", "getrandom"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
aes = "0.8"
ring = "0.17"
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
lzfse_rust = "0.2.1"
apfs = "0.4.1"
apple-xar = { version = "0.20", default-features = false }
roxmltree = "0.21"
yaxpeax-arm = { version = "0.5.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3.2", default-features = false, features = ["std"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
schemars = "1"
flate2 = "1"
serde-pickle = "1.2.0"
num-bigint = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
time = { version = "0.3", features = ["local-offset"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console"] }
sevenz-rust = { version = "0.6.1", default-features = false }
tar = "0.4"

[dev-dependencies]
sevenz-rust = { version = "0.6.1", default-features = false }
tar = "0.4"

[patch.crates-io]
apfs = { path = "vendor/apfs" }
