[package]
name = "ipatool-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of ipatool-fairplay"

[[bin]]
name = "ipatool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
plist = "1.10"
regex = "1.13"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zeroize = "1.9"
clap_complete = "4.5"
cookie = "0.18"
libc = "0.2"
zstd = "0.13"
libloading = "0.8"
dirs = "6"
tempfile = "3.27"
base64 = "0.22"
hpke = { version = "0.14.1", default-features = false, features = ["nistp", "aes", "alloc", "getrandom"] }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
lzfse_rust = "0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
