<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">ipatool-rs architecture</title>
<desc id="desc">CLI and MCP share Rust catalog, account, package, and FairPlay modules. Relevant workflows use Unicorn with Apple guest images, platform credential stores, state caches, and Apple network services. Public catalog requests do not require guest execution. Some live account and FairPlay flows remain unverified.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64a9a4" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="1200" height="980" rx="24" fill="#f8fbf9" stroke="none" stroke-width="1.5"/><rect x="54" y="42" width="64" height="7" rx="3" fill="#f38366" stroke="none" stroke-width="1.5"/><text x="54" y="99" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#173b43">How ipatool-rs fits together</text><text x="54" y="134" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4b6970">Shared Rust workflows with platform services and build-specific guest execution</text><rect x="54" y="165" width="522" height="96" rx="20" fill="#ffe3d5" stroke="none" stroke-width="1.5"/><text x="78" y="204" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#173b43">CLI</text><text x="78" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#173b43">Commands, flags, text and JSON output</text><rect x="624" y="165" width="522" height="96" rx="20" fill="#d9f3ec" stroke="none" stroke-width="1.5"/><text x="648" y="204" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#173b43">MCP server</text><text x="648" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#173b43">Six tools over standard input / output</text><g fill="none" stroke="#64a9a4" stroke-width="2.5" marker-end="url(#arrow)"><path d="M315 261 V292"/><path d="M885 261 V292"/></g><rect x="54" y="302" width="1092" height="260" rx="22" fill="#ffffff" stroke="#d1e4df" stroke-width="1.5"/><text x="78" y="341" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4b6970">RUST APPLICATION MODULES</text><rect x="78" y="365" width="248" height="133" rx="16" fill="#e2f2fb" stroke="none" stroke-width="1.5"/><text x="95" y="402" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#173b43">Catalog</text><text x="95" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Search and lookup</text><text x="95" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Latest version IDs</text><rect x="350" y="365" width="248" height="133" rx="16" fill="#d9f3ec" stroke="none" stroke-width="1.5"/><text x="367" y="402" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#173b43">Account + Store</text><text x="367" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Login and licenses</text><text x="367" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">History and metadata</text><rect x="622" y="365" width="248" height="133" rx="16" fill="#fff1bd" stroke="none" stroke-width="1.5"/><text x="639" y="402" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#173b43">Packages</text><text x="639" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">IPA / PKG downloads</text><text x="639" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Metadata and SINF</text><rect x="894" y="365" width="248" height="133" rx="16" fill="#eee3fb" stroke="none" stroke-width="1.5"/><text x="911" y="402" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#173b43">FairPlay</text><text x="911" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Diagnostics and recovery</text><text x="911" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Model-based decryption</text><text x="78" y="536" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4b6970">Modules use the services below where required; public catalog queries do not execute Apple guests.</text><g fill="none" stroke="#64a9a4" stroke-width="2.5"><path d="M600 562 V587 H232 V613" marker-end="url(#arrow)"/><path d="M600 587 V613" marker-end="url(#arrow)"/><path d="M600 587 H968 V613" marker-end="url(#arrow)"/></g><rect x="54" y="625" width="356" height="229" rx="20" fill="#e9e4fb" stroke="none" stroke-width="1.5"/><text x="76" y="668" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#173b43">Guest runtime</text><text x="76" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Unicorn CPU emulation</text><text x="76" y="744" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Pinned Store / SAP images</text><text x="76" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Exact-build fairplayd</text><text x="76" y="812" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Rust loaders and host-call models</text><rect x="422" y="625" width="356" height="229" rx="20" fill="#fff1bd" stroke="none" stroke-width="1.5"/><text x="444" y="668" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#173b43">Platform + state</text><text x="444" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">macOS Keychain</text><text x="444" y="744" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Linux Secret Service</text><text x="444" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Windows encrypted file store</text><text x="444" y="812" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Private state and runtime caches</text><rect x="790" y="625" width="356" height="229" rx="20" fill="#d9f3ec" stroke="none" stroke-width="1.5"/><text x="812" y="668" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#173b43">Apple services</text><text x="812" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Public catalog endpoints</text><text x="812" y="744" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Authenticated Store requests</text><text x="812" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Version and package metadata</text><text x="812" y="812" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#173b43">Application package downloads</text><rect x="54" y="887" width="1092" height="53" rx="14" fill="#e7f1ee" stroke="none" stroke-width="1.5"/><text x="78" y="921" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4b6970">OUTPUTS</text><text x="185" y="921" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#173b43">Text / JSON · IPA / PKG packages · Private FairPlay artifacts</text><text x="54" y="964" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4b6970">FairPlay private-data workflows and Linux / Windows account flows still require end-to-end validation.</text>
</svg>
