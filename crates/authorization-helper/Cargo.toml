[package]
name = "ipatool-authorization"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "ipatool-fairplay-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3.27"
